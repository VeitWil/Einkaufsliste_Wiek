<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Haushalt & Küche">
<meta name="format-detection" content="telephone=no">
<title>Haushalts- & Küchenzettel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --ink:#16171A; --muted:#6C6F76; --line:#ECECEA; --line2:#DADAD6; --soft:#F6F6F5;
  --red:#D92D20; --red-d:#B42318; --red-soft:#FDEEEC; --on-red:#FFFFFF;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 6px 20px rgba(20,20,20,.06);
  --f:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#fff;height:100%}
body{margin:0;min-height:100%;overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 58%,rgba(0,0,0,.06) 100%)}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.02em}

.wrap{max-width:640px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left)) max(20px,env(safe-area-inset-right));padding-top:max(28px,calc(env(safe-area-inset-top) + 14px));padding-bottom:120px}
.top h1{font-size:30px;font-weight:700}
.top .sub{margin:4px 0 0;color:var(--muted);font-size:15px}
main{display:flex;flex-direction:column;gap:28px;margin-top:24px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-h h2{font-size:19px;font-weight:650}

.btn{border:0;background:var(--red);color:var(--on-red);border-radius:12px;padding:12px 20px;min-height:48px;font-weight:600;box-shadow:0 1px 2px rgba(217,45,32,.35);transition:background .15s ease,transform .1s ease}
.btn:active{transform:scale(.98)}
@media (hover:hover){.btn:hover{background:var(--red-d)}.btn.ghost:hover{background:var(--soft)}}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.small{min-height:38px;padding:7px 14px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.round{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:20px;line-height:1;display:grid;place-items:center;flex:none;transition:transform .1s ease}
.round:active{transform:scale(.94)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);width:fit-content}
.pill.bad{background:var(--red-soft);color:var(--red)}

.note{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.note p{margin:0;font-size:15px}
.note .row2{display:flex;gap:8px;flex-wrap:wrap}
.soon{background:var(--red-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.soon h2{font-size:15px;font-weight:650;color:var(--red)}
.soon-row{display:flex;flex-wrap:wrap;gap:8px}
.soonchip{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-size:14px}
.soonchip b{color:var(--red);font-weight:600;margin-left:4px}
.link{border:0;background:none;padding:0;color:var(--red);font-weight:600;font-size:14px;width:fit-content;min-height:32px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px;min-height:40px;color:var(--muted)}
.chip svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

.form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.form input,.form select,.add input{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;color:var(--ink);width:100%;min-width:0}

.group{display:flex;flex-direction:column;gap:12px}
.group h3{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;letter-spacing:0}
.group h3 svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.group h3 span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 8px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.tile .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.25;padding-inline:4px}
.tile .x{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--muted);font-size:18px;line-height:1;display:grid;place-items:center}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-inline:2px}
.stepper .q{font-weight:600;font-variant-numeric:tabular-nums;text-align:center;flex:1;min-width:0;font-size:15px}
.tile.empty .ico{opacity:.5}

.ico,.em,.t{position:relative;display:grid;place-items:center;background:var(--soft);overflow:hidden;flex:none}
.ico{aspect-ratio:1/.78;border-radius:11px;font-size:38px}
.em{width:52px;height:52px;border-radius:12px;font-size:24px}
.t{width:44px;height:44px;border-radius:10px;font-size:21px}
.emo{filter:grayscale(1);opacity:.65}
.has .emo{visibility:hidden}
.ph.up{padding:0;object-fit:cover;border-radius:inherit}
.cam{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;z-index:4;padding:0}
.cam svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8%;display:block}

.sc-img{position:relative;width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;background:var(--soft);display:grid;place-items:center;font-size:15px;line-height:1}
.sc-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-img img.fit{object-fit:contain;background:#fff}
.sc-img.has .sc-emo{visibility:hidden}

.add{display:flex;gap:8px}
.add input{flex:1}
.prog{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.rows{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .chk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-size:15px;line-height:1;padding:0}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.li .tx b{font-weight:600;overflow-wrap:anywhere}
.li .tx small{color:var(--muted)}
.li.done .chk{background:var(--red);border-color:var(--red)}
.li.done .tx b{text-decoration:line-through;color:var(--muted)}
.li.done .em{opacity:.55}
.li .x2{border:0;background:none;color:var(--muted);font-size:22px;width:40px;height:40px;flex:none}
.empty-state{background:var(--soft);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-state svg{width:92px;height:auto;display:block}
.empty-state p{margin:0;max-width:36ch}

.rc{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0;width:100%}
.art{position:relative;aspect-ratio:3/2;background:var(--soft);overflow:hidden}
.art .uphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--soft);z-index:1}
.art .photo{z-index:2;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--soft)}

.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.btn,.round{transition:none}}
.sheet-inner{max-width:640px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-art{position:relative;aspect-ratio:3/2;max-height:46vh;width:100%;overflow:hidden;background:var(--soft)}
.sheet-art .art{height:100%;aspect-ratio:auto}
.close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:24px;line-height:1;box-shadow:0 2px 12px rgba(0,0,0,.18);display:grid;place-items:center;z-index:2}
.pad{padding:22px 20px 0;display:flex;flex-direction:column;gap:18px}
.pad h2{font-size:28px;font-weight:700}
.metaline{margin:-8px 0 0;color:var(--muted);font-size:15px}
.pad h3{font-size:18px;font-weight:650}
.ings{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ings li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.ings li:first-child{border-top:0}
.ings .in{flex:1;min-width:0;font-weight:600;display:flex;flex-direction:column;overflow-wrap:anywhere}
.ings .in small{font-weight:500;color:var(--muted)}
.ings .miss .in small{color:var(--red)}
.ings .am{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.allin{margin:0;font-weight:600;color:var(--red)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:16px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.steps li span{padding-top:3px;min-width:0}
.vnote{margin:0;color:var(--muted);font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;position:relative;min-height:54px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--red)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

.phead{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 0}
.phead h2{font-size:22px;font-weight:700}
.ptext{margin:0;color:var(--muted);font-size:15px}
.ptext b{color:var(--ink);overflow-wrap:anywhere}
.pok{margin:0;font-weight:600}
.perr{margin:0;font-weight:600;color:var(--red)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fld input,.linkbox{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px 12px;min-height:46px;font-size:15px;color:var(--ink);width:100%;min-width:0}
.linkbox{background:var(--soft);font-size:13px}
.how{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.how summary{font-weight:600;cursor:pointer;min-height:28px}
.how ol{margin:10px 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--muted)}
.how pre{margin:10px 0;padding:12px;background:var(--soft);border-radius:10px;font-size:12px;overflow-x:auto;white-space:pre}
.coll{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dish{position:absolute;inset:0}
.coll img.ph{position:static;inset:auto;padding:0;width:auto;height:76%;max-width:38%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.14))}
.coll.c1 img.ph{height:84%;max-width:62%}
.coll.c2 img.ph{max-width:46%}
.coll img.ph:nth-of-type(2){margin-inline:-5%;transform:translateY(-4%) scale(1.1);position:relative;z-index:1}

.plan-sum{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.plan-sum b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.plan-sum span{color:var(--muted);font-size:15px}
.days{display:flex;flex-direction:column;gap:12px}
.day{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:12px}
.day.open{border-color:var(--line2)}
.day-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px;border:0;background:none;text-align:left;min-height:68px}
.day-d{display:flex;flex-direction:column;gap:3px;min-width:0}
.day-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-t b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.day-t .dd{color:var(--muted);font-size:14px}
.sum{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.sum.on{display:flex;align-items:center;gap:9px}
.sum.on .ok{color:var(--red);font-style:normal;font-weight:700;flex:none}
.sum.on .nm2{min-width:0;overflow-wrap:anywhere}
.sum.on .sc-img{width:32px;height:32px;background:#fff}
.chev{width:24px;height:24px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease;flex:none}
.day.open .chev{transform:rotate(180deg);stroke:var(--red)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.snap-wrap{padding-bottom:12px}
.snap{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px 16px 10px;scroll-padding-inline:16px}
.snap::-webkit-scrollbar{display:none}
.pc{flex:0 0 80%;max-width:300px;scroll-snap-align:start;position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.pc-art{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.pc-art .art{aspect-ratio:3/2}
.plus{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;border:2px solid var(--red);background:var(--red);color:#fff;font-size:28px;font-weight:500;line-height:1;display:grid;place-items:center;box-shadow:0 4px 12px rgba(217,45,32,.35);z-index:3;transition:transform .1s ease}
.plus:active{transform:scale(.92)}
.plus.on{background:#fff;color:var(--red);font-size:24px;font-weight:700}
.pc-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc-b h3{font-size:17px;font-weight:650}
.hint{margin:0;text-align:center;color:var(--muted);font-size:13px}

/* Orts-Editor */
.cat-edit-list{display:flex;flex-direction:column;gap:8px}
.cat-edit-row{display:flex;gap:8px;align-items:center}
.cat-edit-row input{flex:1;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:15px}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top" id="hdr"></header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Bereiche"><div class="tabs-in" id="tabs"></div></nav>
<input type="file" id="photoPick" accept="image/*" hidden>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Details"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';

/* ---------- Standard-Kategorien / Orte ---------- */
var DEFAULT_CATS=[
  {id:'kuehl',name:'Kühlschrank'},
  {id:'frisch',name:'Obst & Gemüse'},
  {id:'vorrat',name:'Vorratsschrank'},
  {id:'tk',name:'Tiefkühler'},
  {id:'drogerie',name:'Bad & Haushalt'},
  {id:'waesche',name:'Schlafzimmer & Wäsche'}
];

var UNITS=['Stk','g','kg','ml','l','Pkg','Fl.','Rolle','Set'];

/* Erweiterte Emoji-Erkennung (Lebensmittel + Haushaltsartikel + Bettbezüge) */
var EMO=[
  [/bettbezug|bettwäsche|kissenbezug|bettlaken|spannbettlaken/,'🛏️'],
  [/handtuch|badetuch|waschlappen/,'🧴'],
  [/spülmittel|waschmittel|weichspüler|reiniger|seife|schwamm|klopapier|toilettenpapier|küchenrolle|müllbeutel/,'🧹'],
  [/zahnpasta|zahnbürste|shampoo|duschgel/,'🪥'],
  [/kerze|batterie|glühbirne|taschentuch/,'📦'],
  [/kokos/,'🥥'],[/milch|sahne|schmand|joghurt|quark/,'🥛'],[/butter/,'🧈'],
  [/käse|parmesan|gouda|mozzarella|feta/,'🧀'],[/\beier?\b/,'🥚'],[/tomat/,'🍅'],
  [/paprika/,'🫑'],[/zwiebel|lauch/,'🧅'],[/knoblauch/,'🧄'],[/kartoffel/,'🥔'],
  [/karott|möhre/,'🥕'],[/spaghetti|nudel|pasta|penne/,'🍝'],[/\breis\b|basmati/,'🍚'],
  [/mehl|haferflock/,'🌾'],[/linse|bohne|kichererbse|tofu|tempeh|hummus/,'🫘'],[/hähnchen|huhn|geflügel|pute/,'🍗'],
  [/fleisch|hack|steak|schnitzel/,'🥩'],[/wurst|schinken|speck/,'🌭'],[/fisch|lachs|thunfisch/,'🐟'],
  [/öl\b|olive/,'🫒'],[/brot|brötchen|toast/,'🍞'],[/apfel/,'🍎'],[/banane/,'🍌'],
  [/zitrone|limette/,'🍋'],[/orange/,'🍊'],[/erdbeer|beere/,'🍓'],
  [/salat|spinat|kohl|brokkoli/,'🥬'],[/gurke|zucchini/,'🥒'],[/pilz|champignon/,'🍄'],
  [/zucker|schokolade|keks/,'🍫'],[/salz|gewürz|pfeffer|hefeflocken/,'🧂'],[/kaffee/,'☕'],[/tee\b/,'🍵'],

var SYNC_KEY='kuechenzettel-sync-v2';
var sync={db:'',k:'',last:0,err:'',msg:'',pending:null};
var RULES='{\n  "rules": {\n    ".read": false,\n    ".write": false,\n    "haushalte": {\n      "$key": {\n        ".read": true,\n        ".write": true,\n        ".validate": "$key.matches(/^[A-Za-z0-9_-]{12,64}$/)"\n      }\n    }\n  }\n}';

function hostOf(raw){
  var t=String(raw||'').trim().toLowerCase().replace(/^https?:\/\//,'').split(/[\/?#\s]/)[0];
  return /^[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/.test(t)?t:'';
}
function keyOK(k){return /^[A-Za-z0-9_-]{12,64}$/.test(String(k||''));}
function newKey(){var a=new Uint8Array(16),c='abcdefghijklmnopqrstuvwxyz0123456789',o='';crypto.getRandomValues(a);for(var i=0;i<16;i++)o+=c.charAt(a[i]%36);return o;}
function base(host,k){return 'https://'+host+'/haushalte/'+k;}

function saveSync(){
  try{if(sync.db)localStorage.setItem(SYNC_KEY,JSON.stringify({db:sync.db,k:sync.k}));else localStorage.removeItem(SYNC_KEY);}catch(e){}
}

(function(){
  try{var o=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');if(o&&hostOf(o.db)&&keyOK(o.k)){sync.db=o.db;sync.k=o.k;}}catch(e){}
  try{
    var hs=(location.hash||'').replace(/^#/,'');
    if(hs.indexOf('=')>-1){
      var P=new URLSearchParams(hs),d=hostOf(P.get('d')),k=P.get('k');
      if(d&&keyOK(k)&&!(d===sync.db&&k===sync.k)){sync.pending={db:d,k:k};ui.panel='sync';}
      history.replaceState(null,'',location.href.split('#')[0]);
    }
  }catch(e){}
})();

function syncLink(){return location.href.split('#')[0]+'#d='+sync.db+'&k='+sync.k;}
function req(url,opt){
  return fetch(url,opt).then(function(r){
    if(!r.ok){var e=new Error('http');e.status=r.status;throw e;}
    return r.json();
  });
}
function errText(e){
  if(e&&(e.status===401||e.status===403))return 'Zugriff verweigert. Prüfe die Regeln in Firebase.';
  if(e&&e.status===404)return 'Datenbank nicht gefunden. Prüfe die Adresse.';
  if(e&&e.status)return 'Fehler '+e.status+' beim Abgleich.';
  return 'Keine Verbindung zum Internet.';
}
function isTyping(){var a=document.activeElement;return !!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));}
function toArr(x){
  if(Array.isArray(x))return x.filter(Boolean);
  if(x&&typeof x==='object')return Object.keys(x).sort(function(a,b){return a-b;}).map(function(k){return x[k];}).filter(Boolean);
  return [];
}
function okImg(v){return (typeof v==='string'&&v.indexOf('data:image/jpeg;base64,')===0&&v.length<=60000&&/^[A-Za-z0-9+\/=,:;-]+$/.test(v))?v:'';}
function fixPlan(x){
  var o={};

    Object.keys(x).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&RECIPES.some(function(r){return r.id===x[k];}))o[k]=x[k];});
  }
  return o;
}

function fixState(d){
  if(!d||typeof d!=='object')return null;
  var cats = toArr(d.cats).map(function(c){
    return {id:String(c.id||uid()), name:String(c.name||'Ort').slice(0,40)};
  });

  var catIds = cats.map(function(c){return c.id;});

  return {
    v:1,demo:!!d.demo,t:+d.t||0,plan:fixPlan(d.plan),cats:cats,
    pantry:toArr(d.pantry).map(function(p){
      return {id:String(p.id||uid()),name:String(p.name||'').slice(0,80),emoji:String(p.emoji||'📦').slice(0,8),qty:isFinite(+p.qty)?+p.qty:0,unit:String(p.unit||'Stk').slice(0,8),cat:catIds.indexOf(p.cat)>-1?p.cat:catIds[0],exp:/^\d{4}-\d{2}-\d{2}$/.test(p.exp||'')?p.exp:'',img:okImg(p.img)};
    }).filter(function(p){return p.name;}),
    list:toArr(d.list).map(function(i){
      return {id:String(i.id||uid()),name:String(i.name||'').slice(0,80),emoji:String(i.emoji||'📦').slice(0,8),note:String(i.note||'').slice(0,120),done:!!i.done,amt:String(i.amt||'').slice(0,30),auto:!!i.auto,from:toArr(i.from).map(String).filter(function(k){return /^\d{4}-\d{2}-\d{2}\|[a-z0-9-]+$/.test(k);}).slice(0,30)};
    }).filter(function(i){return i.name;})
  };
}

var pushT=null,pushing=false,pushAgain=false;
function save(){
  state.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  schedulePush();
}
function schedulePush(){if(!sync.db)return;clearTimeout(pushT);pushT=setTimeout(doPush,700);}
function doPush(){
  pushT=null;
  if(!sync.db)return;
  if(pushing){pushAgain=true;return;}
  pushing=true;
  req(base(sync.db,sync.k)+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)})
    .then(function(){sync.last=Date.now();sync.err='';})
    .catch(function(e){sync.err=errText(e);})
    .then(function(){pushing=false;if(pushAgain){pushAgain=false;doPush();}syncUI();});
}
function pull(force){
  if(!sync.db||sync.pending)return Promise.resolve();
  if(!force&&(pushing||pushT))return Promise.resolve();
  return req(base(sync.db,sync.k)+'/t.json').then(function(rt){
    sync.last=Date.now();sync.err='';
    var lt=state.t||0;
    if(rt===null){doPush();return;}
    if(typeof rt==='number'&&rt>lt){
      if(isTyping()&&!force)return;
      return req(base(sync.db,sync.k)+'.json').then(function(d){
        var ns=fixState(d);
        if(ns){state=ns;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}render();}
      });
    }
    if(typeof rt==='number'&&rt<lt)schedulePush();
  }).catch(function(e){sync.err=errText(e);}).then(syncUI);
}

function connect(raw){
  var host=hostOf(raw);
  if(!host){sync.msg='Ungültige Adresse. Sie endet auf firebasedatabase.app oder firebaseio.com.';syncUI();return;}
  var k=newKey();
  sync.msg='Verbinde …';syncUI();
  req(base(host,k)+'/t.json').then(function(){
    sync.db=host;sync.k=k;sync.err='';sync.msg='';saveSync();
    state.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
    doPush();ui.panel='sync';render();toast('Verbunden');
  }).catch(function(e){sync.msg=errText(e);syncUI();});
}
function joinPending(){
  var pd=sync.pending;if(!pd)return;
  sync.msg='Verbinde …';syncUI();
  req(base(pd.db,pd.k)+'.json').then(function(d){
    sync.db=pd.db;sync.k=pd.k;sync.pending=null;sync.msg='';sync.err='';sync.last=Date.now();saveSync();
    var ns=fixState(d);
    if(ns){state=ns;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
    else{state.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}doPush();}
    ui.panel=null;render();toast('Verbunden');
  }).catch(function(e){sync.msg=errText(e);syncUI();});
}
function syncUI(){renderHeader();if(ui.panel&&!isTyping())renderSheet();}

}

/* ---------- Hilfsfunktionen ---------- */
function daysLeft(exp){
  if(!exp)return null;
  var d=new Date(exp+'T00:00:00');if(isNaN(d))return null;
  var t=new Date();t.setHours(0,0,0,0);
  return Math.round((d-t)/864e5);
}
function dayLabel(n){return n<0?'abgelaufen':n===0?'heute':n===1?'morgen':'in '+n+' Tg.';}
function numStr(x){var r=Math.round(x*100)/100;return String(r).replace('.',',');}
function fmtQty(p){return numStr(p.qty)+' '+p.unit;}
function stepFor(u){return (u==='g'||u==='ml')?50:(u==='kg'||u==='l')?0.5:1;}
function findP(id){return state.pantry.filter(function(p){return p.id===id;})[0];}
function findL(id){return state.list.filter(function(p){return p.id===id;})[0];}
function recipe(id){return RECIPES.filter(function(r){return r.id===id;})[0];}
function keyHit(n,k){
  if(k.charAt(0)==='=')return new RegExp('(^|[^a-zäöüß])'+k.slice(1)).test(n);
  return n.indexOf(k)>-1;
}
function hasIng(g){
  return state.pantry.some(function(p){
    if(!(p.qty>0))return false;
    var n=norm(p.name);
    return g.k.some(function(k){return keyHit(n,k);});
  });
}
function stat(r){return {r:r,have:r.ings.filter(hasIng).length,total:r.ings.length};}
function miss_n(r){return r.ings.filter(function(g){return !hasIng(g);}).length;}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}

/* ---------- Wochenplan ---------- */
var WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MON=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
function planDays(){
  var out=[];
  for(var i=0;i<7;i++){
    var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);
    var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    out.push({iso:iso,name:WD[d.getDay()],date:d.getDate()+'. '+MON[d.getMonth()],tag:i===0?'Heute':i===1?'Morgen':''});
  }
  return out;
}
function prunePlan(){
  var t=isoIn(0),ch=false;
  Object.keys(state.plan).forEach(function(k){if(k<t){delete state.plan[k];ch=true;}});
  if(ch)save();
}
function suggestions(iso){
  var other={};
  Object.keys(state.plan).forEach(function(d){if(d!==iso)other[state.plan[d]]=1;});
  return RECIPES.map(function(r){
    var x=stat(r);
    x.score=x.have/x.total-(other[r.id]?0.6:0)-miss_n(r)*0.02+(hash(r.id+iso)%1000)/1000*0.25;
    return x;
  }).sort(function(a,b){return b.score-a.score;});
}
function planAdd(iso,rid){
  var r=recipe(rid);if(!r||state.plan[iso]===rid)return;
  if(state.plan[iso])planRemove(iso);
  state.plan[iso]=rid;
  var key=iso+'|'+rid,miss=r.ings.filter(function(g){return !hasIng(g);});
  miss.forEach(function(g){
    var ex=state.list.filter(function(i){return !i.done&&norm(i.name)===norm(g.n);})[0];
    if(ex){
      if(!ex.from)ex.from=[];
      if(ex.from.indexOf(key)<0)ex.from.push(key);
      if(!ex.amt)ex.amt=g.a;
    }else{
      state.list.unshift({id:uid(),name:g.n,emoji:emojiFor(g.n),note:'',done:false,amt:g.a,auto:true,from:[key]});
    }
  });
  toast(r.name+' geplant');
}
function planRemove(iso){
  var rid=state.plan[iso];if(!rid)return;
  var key=iso+'|'+rid;
  delete state.plan[iso];
  state.list=state.list.filter(function(i){
    if(!i.from)return true;
    var ix=i.from.indexOf(key);if(ix<0)return true;
    i.from.splice(ix,1);
    return !(i.from.length===0&&i.auto&&!i.done);
  });
}
function noteOf(i){
  if(i.from&&i.from.length){
    var names=[];
    i.from.forEach(function(k){var r=recipe(String(k).split('|')[1]);if(r&&names.indexOf(r.name)<0)names.push(r.name);});
    if(names.length)return (i.amt?i.amt+' · ':'')+'für '+names.join(', ');
  }
  return i.note||'';
}
function addToList(name,note){
  name=String(name||'').trim();if(!name)return false;
  var dup=state.list.some(function(i){return !i.done&&norm(i.name)===norm(name);});
  if(dup)return false;
  state.list.unshift({id:uid(),name:name,emoji:emojiFor(name),note:note||'',done:false});
  return true;
}

function userImg(name){
  var n=norm(name),all=state.pantry.concat(state.list);
  for(var i=0;i<all.length;i++){
    var it=all[i];if(!it.img)continue;
    if(norm(it.name)===n)return it.img;
  }
  return '';
}

function ingPhoto(name){
  var u=userImg(name);if(u)return u;
  var n=norm(name);
  for(var q=0;q<UNS.length;q++){if(UNS[q][0].test(n))return usUrl(UNS[q][1]);}
  return '';
}

function thumbHTML(url,emoji,cls,name){
  var mine=url&&url.indexOf('data:image/jpeg')===0,cover=mine||(url&&url.indexOf(USB)===0);
  return '<span class="'+cls+(url?' has':'')+'" aria-hidden="true"><span class="emo">'+emoji+'</span>'+(url?'<img class="ph'+(cover?' up':'')+'" src="'+esc(url)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+'</span>';
}

function miniThumb(name){
  var u=ingPhoto(name);
  return '<span class="sc-img'+(u?' has':'')+'" aria-hidden="true"><span class="sc-emo">'+emojiFor(name)+'</span>'+(u?'<img class="mini" src="'+esc(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+'</span>';
}

function collageHTML(r){
  var urls=[],seen={};
  r.ings.forEach(function(g){
    var u=ingPhoto(g.n);if(u&&!seen[u]){seen[u]=1;urls.push(u);}
  });
  urls=urls.slice(0,3);
  if(!urls.length)return '';
  return '<div class="coll c'+urls.length+'">'+urls.map(function(u){return '<img class="ph" src="'+esc(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer">';}).join('')+'</div>';
}

function art(id){
  var r=recipe(id);if(!r)return '';
  return '<div class="art">'+dishSVG(id)+collageHTML(r)+(UREC[id]?'<img class="uphoto" src="'+usUrl(UREC[id])+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+'</div>';
}

/* ---------- Aktionen ---------- */
function act(a,d){
  var p;
  switch(a){
    case 'tab':ui.tab=d.x;ui.recipe=null;ui.panel=null;window.scrollTo(0,0);break;
    case 'cat':ui.cat=d.x;break;
    case 'toggle-add':ui.addOpen=!ui.addOpen;break;
    case 'edit-cats-toggle':ui.editCats=!ui.editCats;break;
    case 'add-cat':
      var name=prompt('Name des neuen Orts (z. B. Keller, Bad, Abstellraum):');
      if(name&&name.trim()){state.cats.push({id:'ort_'+uid(),name:name.trim()});save();}
      break;
    case 'del-cat':
      if(state.cats.length<=1){toast('Es muss mindestens 1 Ort existieren');break;}
      state.cats=state.cats.filter(function(c){return c.id!==d.id;});
      var fallback=state.cats[0].id;
      state.pantry.forEach(function(p){if(p.cat===d.id)p.cat=fallback;});
      save();
      break;
    case 'inc':p=findP(d.id);if(p){p.qty=Math.round((p.qty+(p.qty<=0?1:stepFor(p.unit)))*100)/100;save();}break;
    case 'dec':p=findP(d.id);if(p){p.qty=Math.max(0,Math.round((p.qty-stepFor(p.unit))*100)/100);save();}break;
    case 'del-pantry':state.pantry=state.pantry.filter(function(x){return x.id!==d.id;});save();break;
    case 'to-list':p=findP(d.id);if(p){toast(addToList(p.name,'')?p.name+' steht auf der Liste':'Steht schon auf der Liste');save();}break;
    case 'demo-clear':state.pantry=[];state.list=[];state.plan={};state.demo=false;save();break;
    case 'demo-keep':state.demo=false;save();break;
    case 'toggle-li':var l=findL(d.id);if(l){l.done=!l.done;save();}break;
    case 'del-li':state.list=state.list.filter(function(x){return x.id!==d.id;});save();break;
    case 'stow':
      var n=0;
      state.list.filter(function(x){return x.done;}).forEach(function(x){
        var ex=state.pantry.filter(function(p){return norm(p.name)===norm(x.name);})[0];
        if(ex){ex.qty=Math.max(0,ex.qty)+1;}
        else{state.pantry.push({id:uid(),name:x.name,emoji:x.emoji,qty:1,unit:'Stk',cat:guessCat(x.name),exp:''});}
        n++;
      });
      state.list=state.list.filter(function(x){return !x.done;});
      save();toast(n+' Artikel einsortiert');break;
    case 'photo':ui.photoFor=d.id;document.getElementById('photoPick').click();return;
    case 'open':ui.recipe=d.id;break;
    case 'day':ui.openDay=(ui.openDay===d.day)?null:d.day;break;
    case 'plan-add':planAdd(d.day,d.id);save();break;
    case 'plan-remove':planRemove(d.day);save();toast('Aus dem Plan genommen');break;
    case 'close':ui.recipe=null;ui.panel=null;break;
    case 'sync-connect':ui.urlDraft=(document.getElementById('sy-url')||{}).value||'';connect(ui.urlDraft);break;
    case 'sync-join':joinPending();break;
    case 'sync-cancel':sync.pending=null;sync.msg='';ui.panel=null;break;
    case 'sync-now':pull(true);break;
    case 'sync-off':sync.db='';sync.k='';sync.err='';sync.msg='';saveSync();toast('Getrennt');break;
    case 'copy-link':copyText((document.getElementById('sy-link')||{}).value||'','Link kopiert');break;
    case 'copy-rules':copyText(RULES,'Regeln kopieren');break;
    case 'add-ing':
      var r=recipe(d.id),g=r.ings[+d.i];
      toast(addToList(g.n,'für '+r.name)?g.n+' steht auf der Liste':'Steht schon auf der Liste');save();break;
  }
  render();
}

function shrink(file,cb){
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var S=256,c=document.createElement('canvas');c.width=S;c.height=S;
      var w=im.width,h=im.height,m=Math.min(w,h),ctx=c.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);
      ctx.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,S,S);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
}

document.getElementById('photoPick').addEventListener('change',function(e){
  var f=e.target.files[0],id=ui.photoFor;e.target.value='';
  if(!f||!id)return;
  shrink(f,function(img){
    var p=findP(id);
    if(p&&img){p.img=img;save();render();toast('Foto gespeichert');}
  });
});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.act==='rename-cat'){
    var c=state.cats.filter(function(x){return x.id===t.dataset.id;})[0];
    if(c){c.name=t.value;save();}
  }
});

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  act(b.dataset.act,b.dataset);
});

document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==='addForm'){
    var name=document.getElementById('np-name').value.trim();if(!name)return;
    var q=parseFloat(String(document.getElementById('np-qty').value).replace(',','.'));if(isNaN(q)||q<0)q=1;
    var item={id:uid(),name:name,emoji:emojiFor(name),qty:q,unit:document.getElementById('np-unit').value,cat:document.getElementById('np-cat').value,exp:document.getElementById('np-exp').value||'',img:''};
    var fl=document.getElementById('np-photo').files[0];
    var done=function(img){item.img=img||'';state.pantry.unshift(item);ui.addOpen=false;save();render();toast(name+' eingetragen');};
    if(fl)shrink(fl,done);else done('');
  }else if(f.id==='listForm'){
    var inp=document.getElementById('li-name');
    var ok=addToList(inp.value,'');
    save();render();
    if(!ok)toast('Steht schon auf der Liste');
  }
});

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(ui.recipe||ui.panel)){ui.recipe=null;ui.panel=null;render();}});
window.addEventListener('hashchange',function(){if(location.hash==='#einrichten'){ui.panel='sync';render();}});

prunePlan();
render();
pull();
})();
</script>
</body>
</html>
